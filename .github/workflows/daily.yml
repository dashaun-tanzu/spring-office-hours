name: Daily Scheduled Action

on:
  schedule:
    # Runs every day at 04:16 UTC
    - cron: '16 4 * * *'

  # Optional: Allow manual triggering
  workflow_dispatch:

# Add permissions for the workflow
permissions:
  contents: write  # Allows reading and writing repository contents
  actions: read    # Allows reading workflow runs

# A manual run and the scheduled run must not race each other to push.
concurrency:
  group: daily-newsletter
  cancel-in-progress: false

jobs:
  daily-job:
    runs-on: ubuntu-latest
    # Generation plus the full retry backoff is well under 10 minutes; this keeps a
    # hung newsletter-cli from occupying a runner for the default 6 hours.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Use PAT if GITHUB_TOKEN doesn't have sufficient permissions
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download latest newsletter-cli release
        env:
          # Authenticated API calls get 1000 req/hr per repo instead of the 60 req/hr
          # per-IP anonymous limit, which shared runners can exhaust.
          GH_API_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading latest release from dashaun-tanzu/newsletter-cli..."

          # Get the latest release info from GitHub API
          LATEST_RELEASE=$(curl -s \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dashaun-tanzu/newsletter-cli/releases/latest)

          # Debug: Show the API response
          echo "API Response:"
          echo "$LATEST_RELEASE" | jq '.' || echo "Failed to parse JSON response"
          
          # Check if we have assets at all
          ASSETS_COUNT=$(echo "$LATEST_RELEASE" | jq '.assets | length' 2>/dev/null || echo "0")
          echo "Number of assets found: $ASSETS_COUNT"
          
          if [ "$ASSETS_COUNT" -eq "0" ]; then
            echo "No assets found in latest release. Available asset names:"
            echo "$LATEST_RELEASE" | jq -r '.assets[]?.name' 2>/dev/null || echo "No assets available"
            exit 1
          fi
          
          # List all available assets
          echo "Available assets:"
          echo "$LATEST_RELEASE" | jq -r '.assets[].name' 2>/dev/null || echo "Could not list assets"
          
          # Try to find the Linux binary (check different possible names)
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r '
            .assets[] | 
            select(.name | test("newsletter-linux-amd64|newsletter-linux|newsletter_linux")) | 
            .browser_download_url
          ' 2>/dev/null | head -n1)
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find Linux binary. Trying first asset as fallback..."
            DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[0].browser_download_url' 2>/dev/null)
          fi
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find any downloadable assets"
            exit 1
          fi
          
          echo "Download URL: $DOWNLOAD_URL"
          
          # Download the binary
          curl -L -o newsletter-cli "$DOWNLOAD_URL"
          
          # Make it executable
          chmod +x newsletter-cli
          
          # Verify download
          ls -la newsletter-cli

      - name: Run newsletter-cli
        shell: bash
        env:
          # The YouTube section is intermittently empty on scheduled runs, so the
          # generated output is validated and regenerated with exponential backoff.
          MAX_ATTEMPTS: 5
          INITIAL_DELAY_SECONDS: 15
          MAX_DELAY_SECONDS: 240
          MIN_YOUTUBE_ITEMS: 1
        run: |
          # Count list items under the "## YouTube:" heading, stopping at the next heading.
          count_youtube_items() {
            awk '
              /^## YouTube:?[[:space:]]*$/ { inside = 1; next }
              /^## / { inside = 0 }
              inside && /^[-*] / { n++ }
              END { print n + 0 }
            ' "$1"
          }

          # Print the list items under the "## YouTube:" heading.
          extract_youtube_items() {
            awk '
              /^## YouTube:?[[:space:]]*$/ { inside = 1; next }
              /^## / { inside = 0 }
              inside && /^[-*] / { print }
            ' "$1"
          }

          # Replace the YouTube section of $1 with the items in file $2.
          splice_youtube_items() {
            awk -v itemsfile="$2" '
              BEGIN { while ((getline line < itemsfile) > 0) items[n++] = line }
              /^## YouTube:?[[:space:]]*$/ && !done {
                print; print ""
                for (i = 0; i < n; i++) print items[i]
                inside = 1; done = 1; next
              }
              inside && /^## / { print ""; inside = 0 }
              inside { next }
              { print }
            ' "$1"
          }

          delay="$INITIAL_DELAY_SECONDS"
          success=false

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::newsletter-cli attempt $attempt of $MAX_ATTEMPTS"
            rm -f spring-update.md

            if ! ./newsletter-cli full-update; then
              echo "newsletter-cli exited non-zero."
            elif [ ! -s spring-update.md ]; then
              echo "newsletter-cli produced no spring-update.md (or an empty one)."
            else
              # Keep the newest usable issue, even if its YouTube section is empty.
              cp spring-update.md spring-update.candidate
              youtube_items=$(count_youtube_items spring-update.md)
              echo "YouTube entries: $youtube_items (minimum required: $MIN_YOUTUBE_ITEMS)"
              if [ "$youtube_items" -ge "$MIN_YOUTUBE_ITEMS" ]; then
                echo "Newsletter generated successfully on attempt $attempt."
                success=true
                echo "::endgroup::"
                break
              fi
              echo "YouTube section is empty — retrying."
            fi

            echo "::endgroup::"

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in ${delay}s..."
              sleep "$delay"
              delay=$(( delay * 2 ))
              if [ "$delay" -gt "$MAX_DELAY_SECONDS" ]; then
                delay="$MAX_DELAY_SECONDS"
              fi
            fi
          done

          if [ "$success" != "true" ]; then
            # Every attempt came back empty. Publish today's issue anyway, carrying
            # over the previous issue's YouTube list so the section is never blank.
            if [ ! -s spring-update.candidate ]; then
              echo "::error::newsletter-cli never produced usable output after $MAX_ATTEMPTS attempts. Nothing to publish; README.md left unchanged."
              rm -f spring-update.md spring-update.candidate ./newsletter-cli
              exit 1
            fi

            mv spring-update.candidate spring-update.md
            extract_youtube_items README.md > previous-youtube.txt
            carried=$(grep -c '' previous-youtube.txt || true)

            if [ "$carried" -ge "$MIN_YOUTUBE_ITEMS" ]; then
              splice_youtube_items spring-update.md previous-youtube.txt > spring-update.spliced
              mv spring-update.spliced spring-update.md
              spliced_count=$(count_youtube_items spring-update.md)
              if [ "$spliced_count" -ge "$MIN_YOUTUBE_ITEMS" ]; then
                echo "::warning::YouTube section was empty after $MAX_ATTEMPTS attempts; carried over $spliced_count entries from the previous issue."
              else
                echo "::warning::YouTube section was empty after $MAX_ATTEMPTS attempts and the carry-over could not be spliced in (no '## YouTube:' heading in the new issue). Publishing without it."
              fi
            else
              echo "::warning::YouTube section was empty after $MAX_ATTEMPTS attempts and the previous issue had no entries to carry over. Publishing without it."
            fi
            rm -f previous-youtube.txt
          fi

          mv spring-update.md README.md
          rm -f spring-update.candidate ./newsletter-cli

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --porcelain
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update README.md via newsletter-cli [skip ci]"
          git push